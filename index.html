<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tqf.gadget — Official Store by Taufiq</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* PALET WARNA BERDASARKAN LOGO TQF.GADGET */
        :root {
            --bg-dark: #080d1a;
            --card-bg: #0f172a;
            --accent-cyan: #00d2fe;
            --accent-cyan-glow: rgba(0, 210, 254, 0.35);
            --accent-green: #22c55e;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-line: #1e293b;
            --wa-color: #25d366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* HEADER DENGAN LOGO & GLOW EFFECT */
        header {
            background: linear-gradient(180deg, #0f172a 0%, #080d1a 100%);
            padding: 30px 16px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-line);
            position: relative;
        }

        .logo-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 12px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent-cyan), #1e293b, var(--accent-cyan));
            box-shadow: 0 0 25px var(--accent-cyan-glow);
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .brand-title {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-title span {
            color: var(--accent-cyan);
        }

        .by-owner {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 2px;
            font-style: italic;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .badge {
            background-color: rgba(0, 210, 254, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 210, 254, 0.3);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-green {
            background-color: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            border-color: rgba(34, 197, 94, 0.3);
        }

        /* CONTAINER & FILTER */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .filter-card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-line);
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .filter-card {
                flex-direction: row;
            }
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-line);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan-glow);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        .filter-selects {
            display: flex;
            gap: 8px;
        }

        .filter-selects select {
            flex: 1;
            padding: 12px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-line);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        /* KATALOG GRID */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-line);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-50%);
            box-shadow: 0 10px 25px rgba(0, 210, 254, 0.15);
        }

        .img-container {
            position: relative;
            width: 100%;
            padding-top: 80%;
            background-color: #000000;
        }

        .img-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .bg-ready { background-color: var(--accent-green); color: #000000; }
        .bg-sold { background-color: #ef4444; color: #ffffff; }

        .card-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .brand-tag {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            font-weight: 700;
            text-transform: uppercase;
        }

        .item-name {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 4px 0;
        }

        .price-tag {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--accent-cyan);
            margin-bottom: 12px;
        }

        .spec-list {
            list-style: none;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .spec-list li {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spec-list i {
            color: var(--accent-cyan);
            width: 14px;
        }

        .btn-action {
            margin-top: auto;
            background: linear-gradient(135deg, #00d2fe, #0284c7);
            color: #000000;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .btn-sold {
            background: #334155;
            color: #94a3b8;
            pointer-events: none;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <!-- HEADER DENGAN LOGO ENGRAVED -->
    <header>
        <div class="logo-wrapper">
            <!-- PENTING: Ganti 'LOGO_TQF.PNG' sesuai nama file logo kamu di GitHub -->
            <img src="LOGO TQF.PNG" alt="tqf.gadget Logo">
        </div>
        <div class="brand-title">TQF<span>.GADGET</span></div>
        <div class="by-owner">by Taufiq</div>

        <div class="badges">
            <span class="badge badge-green"><i class="fa-solid fa-circle-check"></i> QC 100% Normal</span>
            <span class="badge"><i class="fa-solid fa-shield-halved"></i> Garansi Toko</span>
            <span class="badge"><i class="fa-solid fa-handshake"></i> Melayani COD</span>
        </div>
    </header>

    <div class="container">
        <!-- FILTER & SEARCH -->
        <div class="filter-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Cari unit (misal: Samsung A52, iPhone)..." onkeyup="filterItems()">
            </div>
            <div class="filter-selects">
                <select id="brandFilter" onchange="filterItems()">
                    <option value="ALL">Semua Brand</option>
                    <option value="Samsung">Samsung</option>
                    <option value="Xiaomi">Xiaomi / Poco</option>
                    <option value="Apple">Apple / iPhone</option>
                    <option value="Vivo">Vivo</option>
                    <option value="Oppo">Oppo / Realme</option>
                </select>
                <select id="statusFilter" onchange="filterItems()">
                    <option value="ALL">Semua Status</option>
                    <option value="Ready">Ready Stock</option>
                    <option value="Sold Out">Terjual</option>
                </select>
            </div>
        </div>

        <!-- KATALOG PRODUK -->
        <div class="catalog-grid" id="catalogGrid">
            <p style="grid-column: 1/-1; text-align: center; padding: 40px 0; color: var(--text-sub);">
                <i class="fa-solid fa-spinner fa-spin"></i> Memuat data stok terbaru...
            </p>
        </div>

        <footer>
            <p>&copy; 2026 tqf.gadget by Taufiq. All rights reserved.</p>
        </footer>
    </div>

    <script>
        const NO_WA = "6281910418032"; // Ganti dengan No WA kamu
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-m8ygM3npYxQ9mKEditjZaJeULLwj8mwC_cFXCjCa-HV73bxanqE5aYhCjdt1mI_l4TiX88W_oAgg/pub?output=csv"; // Link CSV Publik Google Sheets

        let allProducts = [];

        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
        }

        function parseCSV(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const products = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                if (cols.length >= 8) {
                    products.push({
                        id: cols[0] || `TQ-${i}`,
                        title: cols[1] || 'Unit HP',
                        brand: cols[2] || 'Lainnya',
                        ramRom: cols[4] || '-',
                        condition: cols[6] || '-',
                        qcStatus: cols[7] || '-',
                        price: parseInt(cols[8]) || 0,
                        status: cols[9] || 'Ready',
                        image: cols[10] || 'https://via.placeholder.com/600x600?text=tqf.gadget'
                    });
                }
            }
            return products;
        }

        async function fetchProducts() {
            const grid = document.getElementById('catalogGrid');
            try {
                const res = await fetch(SHEET_CSV_URL);
                const csvText = await res.text();
                allProducts = parseCSV(csvText);
                renderCatalog(allProducts);
            } catch (err) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 40px 0;">Gagal mengambil data dari Google Sheets. Pastikan link CSV sudah benar.</p>`;
            }
        }

        function renderCatalog(items) {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = "";

            if (items.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 40px 0;">Unit tidak ditemukan.</p>`;
                return;
            }

            items.forEach(item => {
                const isReady = item.status.toLowerCase() === "ready";
                const waMessage = encodeURIComponent(`Halo tqf.gadget (by Taufiq), saya mau tanya unit ${item.title} (${item.id}) seharga ${formatRupiah(item.price)} di website. Apakah masih ready?`);
                const waLink = `https://wa.me/${NO_WA}?text=${waMessage}`;

                grid.innerHTML += `
                    <div class="product-card">
                        <div class="img-container">
                            <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/600x600?text=tqf.gadget'">
                            <span class="status-badge ${isReady ? 'bg-ready' : 'bg-sold'}">${item.status}</span>
                        </div>
                        <div class="card-content">
                            <span class="brand-tag">${item.brand}</span>
                            <h3 class="item-name">${item.title}</h3>
                            <div class="price-tag">${formatRupiah(item.price)}</div>
                            <ul class="spec-list">
                                <li><i class="fa-solid fa-microchip"></i> RAM/Internal: ${item.ramRom}</li>
                                <li><i class="fa-solid fa-star"></i> Kondisi: ${item.condition}</li>
                                <li><i class="fa-solid fa-square-check"></i> ${item.qcStatus}</li>
                            </ul>
                            ${isReady 
                                ? `<a href="${waLink}" target="_blank" class="btn-action"><i class="fa-brands fa-whatsapp"></i> Chat WhatsApp / COD</a>`
                                : `<a href="#" class="btn-action btn-sold"><i class="fa-solid fa-ban"></i> Terjual</a>`
                            }
                        </div>
                    </div>
                `;
            });
        }

        function filterItems() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const brand = document.getElementById('brandFilter').value;
            const status = document.getElementById('statusFilter').value;

            const filtered = allProducts.filter(item => {
                const mSearch = item.title.toLowerCase().includes(search) || item.ramRom.toLowerCase().includes(search);
                const mBrand = (brand === "ALL") || (item.brand.toLowerCase() === brand.toLowerCase());
                const mStatus = (status === "ALL") || (item.status.toLowerCase() === status.toLowerCase());
                return mSearch && mBrand && mStatus;
            });

            renderCatalog(filtered);
        }

        fetchProducts();
    </script>
</body>
</html>
